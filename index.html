<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sakura AR - Butterfly & Petals</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      .arjs-loader {
        height: 100%; width: 100%; position: absolute; top: 0; left: 0;
        background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
        display: flex; justify-content: center; align-items: center;
      }
      .arjs-loader div { text-align: center; font-size: 1.25em; color: white; }
    </style>
    <script>
      AFRAME.registerComponent('petal-particle', {
        init: function () {
          var el = this.el;
          var speed = (Math.random() * 0.5 + 0.5) * 0.1; // 速度をランダム化
          var directionX = (Math.random() - 0.5) * 0.05; // 左右への揺れをランダム化
          var directionY = (Math.random() - 0.5) * 0.05; // 上下への揺れをランダム化 (今回は重力で下がるので控えめ)
          var rotationSpeed = Math.random() * 5 + 1; // 回転速度をランダム化

          el.setAttribute('scale', {
            x: Math.random() * 100 + 50, // 花びらの大きさをランダムに
            y: Math.random() * 100 + 50,
            z: Math.random() * 100 + 50
          });

          el.setAttribute('rotation', {
            x: Math.random() * 360,
            y: Math.random() * 360,
            z: Math.random() * 360
          });

          this.update = function () {
            var pos = el.getAttribute('position');
            // 下に落ちる動き
            pos.y -= speed;
            // 左右にランダムに揺れる動き
            pos.x += directionX;
            pos.z += directionY;

            // 地面についたら上に戻す（ループさせる）
            if (pos.y < -300) { // 適当な地面の位置
              pos.y = Math.random() * 300 + 300; // ランダムな高さから再出現
              pos.x = Math.random() * 600 - 300; // ランダムなX座標
              pos.z = Math.random() * 600 - 300; // ランダムなZ座標
            }

            el.setAttribute('position', pos);

            // 回転アニメーション
            var rot = el.getAttribute('rotation');
            rot.y += rotationSpeed; // Y軸を中心に回転
            el.setAttribute('rotation', rot);
          };
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader"><div>桜の精を呼んでいます...</div></div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-nft
        type="nft"
        url="https://mikkaichi0278-lab.github.io/sakura10/sakura"
        smooth="true"
        smoothCount="30"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <a-image
          src="butterfly.png"
          position="150 100 -50" 
          scale="250 250 250"
          rotation="-90 0 0"
        ></a-image>

        <a-image src="petal.png" petal-particle position="0 200 0"></a-image>
        <a-image src="petal.png" petal-particle position="100 250 -50"></a-image>
        <a-image src="petal.png" petal-particle position="-50 150 100"></a-image>
        <a-image src="petal.png" petal-particle position="200 100 -100"></a-image>
        <a-image src="petal.png" petal-particle position="-150 300 50"></a-image>
        <a-image src="petal.png" petal-particle position="50 180 -200"></a-image>
        <a-image src="petal.png" petal-particle position="-200 220 0"></a-image>
        </a-nft>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
